# S9a production nginx: Laravel + private X-Accel-Redirect delivery.
# Listens on 8080 so the container runs as non-root (www-data).
# Coolify terminates TLS and forwards HTTP with X-Forwarded-*; Laravel
# trusts the proxy (bootstrap/app.php) so it sees HTTPS.
user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Non-root runtime (www-data): temp paths must be writable without root.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # S9a private delivery (scope section 16): Laravel checks the
        # policy first, then returns X-Accel-Redirect to this internal
        # location backed by storage/app/private. External requests here
        # return 404 because of `internal`.
        location /_private/ {
            internal;
            alias /var/www/html/storage/app/private/;
        }

        # Public covers only: /storage serves storage/app/public via the
        # storage:link symlink. Private files are never under /storage.
        location /storage/ {
            alias /var/www/html/storage/app/public/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Never serve dotfiles, env, or git metadata if they ever land here.
        location ~ /\.(env|git) {
            deny all;
            return 404;
        }
    }
}
